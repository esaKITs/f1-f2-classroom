name: Build GitHub Pages source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-source
  cancel-in-progress: true

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild v1.1.0 site package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site .release-build
          mkdir -p _site .release-build/unpacked
          cat \
            .release/site.b64.aa \
            .release/site.b64.ab \
            .release/site.b64.ac \
            .release/site.b64.ac.1 \
            .release/site.b64.ac.2 \
            .release/site.b64.ad.aa \
            .release/site.b64.ad.ab \
            .release/site.b64.ad.ac > .release-build/site.b64
          cat .release/rem2.aa .release/rem2.ab .release/rem2.ac | base64 -d >> .release-build/site.b64
          base64 -d .release-build/site.b64 > .release-build/site.zip
          unzip -q .release-build/site.zip -d .release-build/unpacked
          release_dir="$(find .release-build/unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$release_dir"
          cp -a "$release_dir"/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          grep -q 'B-1 v1.1.0' _site/index.html
          grep -q '多角形比較' _site/README.md
      - name: Publish site source to gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish F1-F2 Classroom v1.1.0"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
